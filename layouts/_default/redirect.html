<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url={{ .Params.redirect_url }}">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ .Params.redirect_url }}">
    <title>Redirecting&hellip;</title>
  </head>
  <body>
    <p>Redirecting to <a href="{{ .Params.redirect_url }}">{{ .Params.redirect_url }}</a>&hellip;</p>
    <script>window.location.replace({{ .Params.redirect_url | jsonify | safeJS }});</script>
  </body>
</html>
